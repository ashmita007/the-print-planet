[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:backend]
priority=10
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 --threads 2 --worker-class gthread --timeout 60 --keep-alive 75 --max-requests 1000 --max-requests-jitter 100
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:frontend]
priority=20
command=sh -c "until curl -sf http://127.0.0.1:8000/healthz > /dev/null 2>&1; do sleep 1; done; exec node server.js"
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production",INTERNAL_API_URL="http://127.0.0.1:8000",NEXT_PUBLIC_API_URL="",NODE_OPTIONS="--max-old-space-size=160"

[program:nginx]
priority=30
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:warmup]
priority=40
command=sh -c "sleep 4; until curl -sf http://127.0.0.1:3000/ > /dev/null 2>&1; do sleep 1; done; curl -sf http://127.0.0.1:3000/products > /dev/null 2>&1 || true"
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/dev/null
stderr_logfile=/dev/null
