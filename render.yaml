services:
  # -----------------------------------------------------------------
  # The Print Planet: Enterprise Single-Unit Container (Django + Next.js + Nginx)
  # 100% Free Lifetime Deployment — Zero Cost & Permanent Database Architecture
  # -----------------------------------------------------------------
  - type: web
    name: the-print-planet
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # Database Configuration:
      # - Leave empty to run on Ultra-Fast Embedded SQLite WAL engine (Zero Cost & 0ms latency)
      # - OR provide external Lifetime Free PostgreSQL (Supabase 500MB free / Aiven 5GB free)
      - key: DATABASE_URL
        sync: false

      # Django Core Settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

      # Next.js Node Memory Optimization for 512MB Free Tier
      - key: NODE_OPTIONS
        value: "--max-old-space-size=160"

      # Cloudflare R2 Media Storage (Recommended: 10GB Free Lifetime, $0 Egress Fees)
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "the-print-planet"
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # Automated Email Notification System (Gmail / Brevo / Resend / SendGrid)
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        value: "theprintplanet01@gmail.com"

      # Cloudinary Media Storage (Optional Secondary CDN)
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Initial Superuser Account Creation
      - key: CREATE_DEFAULT_OWNER
        value: "True"
      - key: OWNER_USERNAME
        value: "admin"
      - key: OWNER_EMAIL
        value: "theprintplanet01@gmail.com"
      - key: OWNER_PASSWORD
        value: "AdminPass123!Secure"

      # Client Owner Account (Second Admin)
      - key: CLIENT_USERNAME
        sync: false
      - key: CLIENT_EMAIL
        sync: false
      - key: CLIENT_PASSWORD
        sync: false

      # Product Catalog Seeding Control (Default False = 0 fake products)
      - key: SEED_PRODUCTS
        value: "False"
      - key: WIPE_DUMMY_PRODUCTS
        sync: false
