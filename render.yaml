services:
  # -----------------------------------------------------------------
  # The Print Planet: Enterprise Single-Unit Container (Django + Next.js + Nginx)
  # 100% Free Lifetime Deployment — Zero Cost & Permanent Database Architecture
  # -----------------------------------------------------------------
  - type: web
    name: the-print-planet
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      # Database Configuration:
      # - Leave empty to run on Ultra-Fast Embedded SQLite WAL engine (Zero Cost & 0ms latency)
      # - OR provide external Lifetime Free PostgreSQL (Supabase 500MB free / Aiven 5GB free)
      - key: DATABASE_URL
        sync: false

      # Django Core Settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

      # Next.js Node Memory Optimization for 512MB Free Tier
      - key: NODE_OPTIONS
        value: "--max-old-space-size=160"

      # Cloudinary Media Storage (Optional: Free 25GB Tier)
      - key: CLOUDINARY_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Initial Superuser Account Creation (Auto-seeded on deployment)
      - key: CREATE_DEFAULT_OWNER
        value: "True"
      - key: OWNER_USERNAME
        value: "admin"
      - key: OWNER_EMAIL
        value: "owner@theprintplanet.in"
      - key: OWNER_PASSWORD
        value: "AdminPass123!Secure"
